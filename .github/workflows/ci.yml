name: Control Center CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript syntax
        run: node --check assets/app.js
      - name: Validate solver JSON
        run: python -m json.tool data/solvers.json > /dev/null
      - name: Validate required static files
        run: test -f index.html && test -f assets/styles.css && test -f .nojekyll
